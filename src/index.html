<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link href="./styles.css" type="text/css" rel="stylesheet" />
    <title>NFT preview card component</title>
  </head>
  <body class="flex flex-col justify-center items-center bg-blue-950">
    <header><h1 class="sr-only">NFT preview card component</h1></header>
    <main>
      <!-- Main container -->
      <div
        class="flex justify-center mt-8.75 py-6 w-87.5 rounded-2xl bg-blue-900 md:mt-38"
      >
        <!-- Image and texts container -->
        <div class="flex flex-col w-75.5 gap-6">
          <a href="#" class="group relative block focus:outline-none">
            <img
              class="rounded-lg"
              src="../images/image-equilibrium.jpg"
              alt="Equilibrium"
            />

            <div
              class="absolute inset-0 rounded-lg bg-cyan-400 opacity-0 transition-opacity duration-200 group-hover:opacity-50 group-focus:opacity-50 group-active:opacity-50"
            ></div>

            <img
              class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 transition-opacity duration-200 group-hover:opacity-100 group-focus:opacity-100 group-active:opacity-100"
              src="../images/icon-view.svg"
              alt=""
            />
          </a>
          <a
            href="#"
            class="text-preset-1 text-white focus:text-cyan-400 hover:text-cyan-400 active:text-cyan-400"
          >
            Equilibrium #3429
          </a>
          <p class="text-preset-2 text-blue-500">
            Our Equilibrium collection promotes balance and calm.
          </p>
          <div class="flex justify-between">
            <div class="flex items-center gap-2">
              <img
                class="h-4.5"
                src="../images/icon-ethereum.svg"
                alt="ethereum"
              />
              <p class="text-preset-3-semibold text-cyan-400">0.041 ETH</p>
            </div>
            <div class="flex items-center gap-2">
              <img class="h-4" src="../images/icon-clock.svg" alt="clock" />
              <p class="text-preset-3-regular text-blue-500">3 days left</p>
            </div>
          </div>
          <div class="border-b border-blue-50"></div>
          <div class="flex gap-4 items-center">
            <img
              class="w-8.25 border border-white rounded-full"
              src="../images/image-avatar.png"
              alt="Creator"
            />
            <div class="flex gap-2">
              <p class="text-preset-3-regular text-blue-500">Creation of</p>
              <a
                href="#"
                class="text-preset-3-regular text-white focus:text-cyan-400 hover:text-cyan-400 active:text-cyan-400"
              >
                Jules Wyvern
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer aria-label="Site credits" class="font-outfit mt-10">
      <div
        class="flex flex-col font-normal text-xs leading-[150%] tracking-normal text-blue-500 text-center pb-8"
      >
        <p>
          Challenge by
          <a
            class="text-blue-100 focus:text-cyan-400 hover:text-cyan-400 active:text-cyan-400 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:ring-offset-2 focus:ring-offset-blue-900"
            href="https://www.frontendmentor.io?ref=challenge"
          >
            Frontend Mentor.
          </a>
        </p>
        <p>
          Coded by
          <a
            class="text-blue-100 focus:text-cyan-400 hover:text-cyan-400 active:text-cyan-400 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:ring-offset-2 focus:ring-offset-blue-900"
            href="https://www.frontendmentor.io/profile/VirginiaPat"
            >Virginia Patrika.</a
          >
        </p>
      </div>
    </footer>
  </body>
</html>
